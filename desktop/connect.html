<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"><title>ATB · 连接设置</title><link rel="stylesheet" href="connect.css"><script src="connect.js" defer></script></head>
<body><header><div class="brand"><strong>ATB</strong><small>ALL THE BEST</small></div><div><button id="return-viewer" class="secondary" hidden>← 返回工作台</button><span id="settings-title">连接设置</span></div></header><main><p class="eyebrow">ATB / 连接</p><h1>选择你的服务</h1><p class="muted">连接本机、家里的电脑或已部署的公网服务器。</p><div class="grid"><section><h2>本机服务</h2><p>这台电脑运行平台及已安装模块，保存账户与应用数据。</p><button id="connect-local">使用本机服务</button><div class="addresses"><label>本机平台地址</label><code id="local-url"></code><label>Tailscale 远程平台地址</label><div id="tailscale-urls"></div><p class="muted small">手机和观看设备连接同一个 Tailscale 网络后，可在浏览器打开此地址。</p></div></section><section><h2>连接远程服务</h2><p>目标电脑或服务器需要运行 ATB；公网服务器无需 Tailscale。</p><div id="saved-services" hidden><label>已保存的远程服务 · 点击切换</label><div id="saved-connections"></div></div><form id="remote-form"><label for="remote-address">远程服务地址</label><input id="remote-address" placeholder="https://服务器地址:端口" autocomplete="off" maxlength="2048" required><label>远程服务的根证书</label><button type="button" id="choose-certificate" class="secondary">选择 ca.crt 证书</button><p id="certificate-info" class="small muted">正在读取证书…</p><p class="muted small">首次连接时，选择目标服务对应的根证书；公网服务使用 cloud-ca.crt。输入和所选证书会自动保存；验证成功的服务可在上方一键切换。</p><button id="connect-remote">连接远程服务</button></form></section></div><p id="connection-status" role="status"></p><p id="connection-error" role="alert" hidden></p></main></body></html>
